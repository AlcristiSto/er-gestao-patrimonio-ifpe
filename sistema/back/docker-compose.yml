services:
  mongodb:
    image: mongo:7.0
    container_name: catmat-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: "${MONGO_DATABASE:-patrimonio}"
      MONGO_DATABASE: "${MONGO_DATABASE:-patrimonio}"
      MONGO_CATMAT_COLLECTION: "${MONGO_CATMAT_COLLECTION:-catmat}"
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo/init/01-load-catmat.js:/docker-entrypoint-initdb.d/01-load-catmat.js:ro
      - ./data/catmat/carga.json:/carga/carga.json:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' localhost:27017/test | grep 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongodb_data:
